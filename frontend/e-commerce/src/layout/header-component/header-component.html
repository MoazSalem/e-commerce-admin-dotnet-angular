<header class="bg-white border-b border-gray-100 py-4 px-10 flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center space-x-12">
        <a href="/home">
            <div class="text-3xl font-extrabold text-[#0b132b] tracking-tight">E-Store</div>
        </a>
    </div>

    <div class="flex-1 max-w-xl mx-8">
        <div class="relative">
            <input type="text" placeholder="Search products..."
                class="w-full bg-[#f4f7fb] text-sm text-gray-900 rounded-full py-2.5 px-5 pr-10 focus:outline-none focus:ring-2 focus:ring-blue-100 placeholder-gray-400">
            <svg class="w-5 h-5 text-gray-500 absolute right-4 top-2.5" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
        </div>
    </div>

    <div class="flex items-center space-x-6">

        @if (!hideCart()) {
        <button class="relative text-gray-700 hover:text-[#0b132b] cursor-pointer" (click)="goToCart()">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
            </svg>
            <span
                class="absolute -top-2 -right-2.5 bg-[#326e51] text-white text-[10px] 
                font-bold w-5 h-5 rounded-full flex items-center justify-center border border-white">{{cart.totalCartItems()}}</span>
        </button>
        }

        <!-- Profile Dropdown Container -->
        <div class="relative">
            <!-- Avatar Trigger -->
            <button (click)="toggleDropdown()"
                class="focus:outline-none flex items-center rounded-full ring-2 ring-transparent hover:ring-blue-100 transition-all">
                <img src="https://ui-avatars.com/api/?name={{getNameForAvatar(user.name)}}&background=e2e8f0" alt="Profile"
                    class="w-9 h-9 rounded-full border border-gray-200">
            </button>

            @if (isDropdownOpen()) {
            <div class="absolute right-0 mt-3 w-48 bg-white rounded-lg shadow-lg border border-gray-100 py-1 z-50">
                <div class="px-4 py-2 border-b border-gray-100 mb-1">
                    <p class="text-sm font-semibold text-gray-900">{{user.name}}</p>
                    <p class="text-xs text-gray-500 truncate">{{user.email}}</p>
                </div>

                <button (click)="logout()"
                    class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 font-medium transition-colors flex items-center">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                        </path>
                    </svg>
                    Log out
                </button>
            </div>
            }
        </div>

    </div>
</header>
