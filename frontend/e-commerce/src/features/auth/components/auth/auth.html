<div class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-xl shadow-sm border border-gray-100 p-8">

        <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">
            {{ isLoginMode ? 'Welcome Back' : 'Create an Account' }}
        </h2>

        <form [formGroup]="authForm" (ngSubmit)="onSubmit()" class="space-y-5">

            @if (!isLoginMode) {
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" formControlName="name"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                    placeholder="John Doe" />

                @if (authForm.get('name')?.touched && authForm.get('name')?.invalid) {
                <span class="text-xs text-red-500 mt-1">
                    Name is required.
                </span>
                }
            </div>
            }

            <!-- Email Field -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" formControlName="email"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                    placeholder="you@example.com" />
            </div>

            <!-- Password Field -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" formControlName="password"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                    placeholder="••••••••" />
            </div>

            <!-- Submit Button -->
            <button type="submit" [disabled]="authForm.invalid"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg transition-colors disabled:bg-blue-300 disabled:cursor-not-allowed mt-2">
                {{ isLoginMode ? 'Sign In' : 'Sign Up' }}
            </button>
        </form>

        <!-- Toggle Mode Link -->
        <p class="text-center text-sm text-gray-600 mt-6">
            {{ isLoginMode ? "Don't have an account?" : "Already have an account?" }}
            <button type="button" (click)="toggleMode()"
                class="text-blue-600 hover:text-blue-800 font-semibold transition-colors">
                {{ isLoginMode ? 'Sign Up' : 'Sign In' }}
            </button>
        </p>

    </div>
</div>
