<div class="flex flex-col py-6 border-b border-gray-200">
      <div class="flex justify-between items-start mb-6">
        <div>
          <h3 class="text-xl font-bold text-[#0b132b]">{{ item().name }}</h3>
        </div>
        <span class="text-2xl font-bold text-[#0b132b]">{{ item().unitPrice | currency }}</span>
      </div>

      <div class="flex justify-between items-center">
        <!-- Quantity Stepper -->
        <div class="flex items-center border border-gray-300 rounded-lg h-10 w-28 bg-white">
          <button (click)="onDecrease()" class="w-8 h-full flex items-center justify-center text-gray-500 hover:text-gray-800 transition-colors">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
          </button>
          <div class="flex-1 text-center text-sm font-bold text-[#0b132b]">
            {{ item().quantity }}
          </div>
          <button (click)="onIncrease()" class="w-8 h-full flex items-center justify-center text-gray-500 hover:text-gray-800 transition-colors">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          </button>
        </div>

        <!-- Remove Button -->
        <button (click)="onRemove()" class="flex items-center text-[#c53b27] hover:text-red-800 text-sm font-semibold transition-colors">
          <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          Remove
        </button>
      </div>
    </div>
