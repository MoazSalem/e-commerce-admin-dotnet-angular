<div class="bg-white rounded-2xl shadow-sm p-6 flex flex-col h-full hover:shadow-md transition-shadow">
    <div class="text-[10px] font-bold text-emerald-600 tracking-wider mb-2 uppercase">{{ product.category.title }}</div>
    <h3 class="text-xl font-bold text-[#0b132b] mb-1 truncate">{{ product.name }}</h3>

    <!-- Price and Action -->
    <div class="mt-auto flex items-end justify-between">
        <div class="flex flex-col">
            <span class="text-xl font-medium text-[#0b132b]">{{ product.price | currency }}</span>
        </div>
        <button
            class="bg-[#326e51] text-white px-4 py-2.5 rounded-lg text-sm font-semibold flex items-center hover:bg-[#25523c] transition-colors">
            <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z">
                </path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9">
                </path>
            </svg>
            Add
        </button>
    </div>
</div>
