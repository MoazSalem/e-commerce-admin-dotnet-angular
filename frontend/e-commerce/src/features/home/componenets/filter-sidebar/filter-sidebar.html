<div class="bg-white rounded-2xl shadow-sm p-7">
    <h2 class="text-2xl font-extrabold text-[#0b132b] mb-6">Filters</h2>

    <!-- Categories -->
    <div class="mb-8">
        <h4 class="text-xs font-bold text-gray-500 tracking-widest mb-4 uppercase">Categories</h4>
        <div class="space-y-3">
           @if (facade.categoriesResource.value(); as categories) {
                        @for (category of categories; track category.id) {
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="checkbox"
                                [checked]="facade.categoryIds().includes(category.id)"
                                (change)="facade.toggleCategory(category.id)"
                                class="w-5 h-5 rounded text-[#326e51] focus:ring-[#326e51] border-gray-300 accent-[#326e51]">
                            <span class="text-sm font-medium transition-colors hover:text-[#0b132b]"
                                  [class.text-[#0b132b]]="facade.categoryIds().includes(category.id)"
                                  [class.text-gray-600]="!facade.categoryIds().includes(category.id)">
                                {{ category.title }}
                            </span>
                        </label>
                        }
                    }
        </div>
    </div>

    <button (click)="facade.clearCategories()"
        class="w-full border border-gray-300 text-gray-700 font-bold py-2.5 rounded-lg hover:bg-gray-50 transition-colors text-sm">
        Clear All
    </button>
</div>
