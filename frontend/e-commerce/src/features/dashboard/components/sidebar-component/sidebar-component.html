<aside class="w-64 h-full bg-white border-r border-gray-100 flex flex-col justify-between pt-6 sticky top-0">
    <!-- Navigation Links -->
    <nav class="px-4 space-y-2">
        <!-- Dashboard Link (Dynamic Active State) -->
        <button (click)="navigateTo('dashboard')"
            class="w-full flex items-center px-4 py-3 rounded-xl font-bold transition-colors"
            [ngClass]="activeView() === 'dashboard' ? 'bg-[#8ef0c4] text-[#0b132b]' : 'text-gray-500 hover:bg-gray-50 hover:text-[#0b132b]'">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z">
                </path>
            </svg>
            Dashboard
        </button>
        <!-- Other static links for display -->
        <button
            class="w-full flex items-center px-4 py-3 text-gray-500 hover:bg-gray-50 hover:text-[#0b132b] rounded-xl font-bold transition-colors">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
            </svg>
            Inventory
        </button>
    </nav>

    <!-- Bottom Actions & Profile -->
    <div class="px-4">
        <div class="border-t border-gray-100 pt-6 mb-6">
            <button (click)="navigateTo('addProduct')"
                class="w-full bg-[#0b132b] text-white py-3 rounded-xl font-bold flex items-center justify-center hover:bg-gray-800 transition-colors shadow-sm">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Add Product
            </button>
        </div>
    </div>
</aside>
