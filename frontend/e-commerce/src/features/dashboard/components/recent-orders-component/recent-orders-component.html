<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
      <h2 class="text-2xl font-extrabold text-[#0b132b] mb-6">Recent Orders</h2>
      
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-50/50">
              <th class="py-4 px-4 text-xs font-bold text-gray-500 uppercase tracking-widest border-b border-gray-100">Order ID</th>
              <th class="py-4 px-4 text-xs font-bold text-gray-500 uppercase tracking-widest border-b border-gray-100">Customer</th>
              <th class="py-4 px-4 text-xs font-bold text-gray-500 uppercase tracking-widest border-b border-gray-100">Date</th>
              <th class="py-4 px-4 text-xs font-bold text-gray-500 uppercase tracking-widest border-b border-gray-100">Amount</th>
            </tr>
          </thead>
          <tbody>
            @for (order of orders(); track order.id) {
              <tr class="hover:bg-gray-50/30 transition-colors">
                <td class="py-5 px-4 text-sm font-medium text-gray-500 border-b border-gray-50">#ORD-{{ order.id }}</td>
                <td class="py-5 px-4 text-sm font-medium text-[#0b132b] border-b border-gray-50">{{ order.customerName }}</td>
                <td class="py-5 px-4 text-sm font-medium text-gray-500 border-b border-gray-50">{{ order.createdAt | date: 'medium'}}</td>
                <td class="py-5 px-4 text-sm font-bold text-[#0b132b] border-b border-gray-50">{{ order.total | currency }}</td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
