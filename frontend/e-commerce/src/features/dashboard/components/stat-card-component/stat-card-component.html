<div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 flex flex-col">
    <div class="flex justify-between items-start mb-4">
        <!-- Dynamic Main Icon Container -->
        <div class="w-10 h-10 rounded-lg flex items-center justify-center" [ngClass]="iconBgClass()">
            <ng-content></ng-content>
        </div>

        <!-- Dynamic Trend Badge -->
        <div class="flex items-center px-2 py-1 rounded-md text-xs font-bold" [ngClass]="trendBgClass()">
            <span [ngClass]="trendTextClass()" class="flex items-center">
                @if (trendIcon() === 'up') {
                <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3"
                        d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                </svg>
                } @else if (trendIcon() === 'down') {
                <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3"
                        d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6"></path>
                </svg>
                } @else if (trendIcon() === 'check') {
                <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                </svg>
                }
                {{ trendLabel() }}
            </span>
        </div>
    </div>

    <p class="text-[13px] font-bold text-gray-500 mb-1">{{ title() }}</p>

    <!-- Value with truncation to prevent the wrapping issue seen in the design -->
    <h3 class="text-3xl font-extrabold text-[#0b132b] truncate tracking-tight">{{ value() }}</h3>
</div>
