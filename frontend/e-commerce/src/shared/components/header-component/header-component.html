<header class="bg-white border-b border-gray-100 py-4 px-10 flex items-center justify-between sticky top-0 z-50">
      <div class="flex items-center space-x-12">
        <div class="text-3xl font-extrabold text-[#0b132b] tracking-tight">E-Store</div>
        
        <nav class="hidden md:flex space-x-8 text-sm font-bold">
          <a href="#" class="text-[#0b132b] border-b-2 border-[#0b132b] pb-1">Shop</a>
          <a href="#" class="text-gray-500 hover:text-[#0b132b] transition-colors pb-1">Categories</a>
          <a href="#" class="text-gray-500 hover:text-[#0b132b] transition-colors pb-1">Deals</a>
        </nav>
      </div>

      <div class="flex-1 max-w-xl mx-8">
        <div class="relative">
          <input type="text" placeholder="Search products..." class="w-full bg-[#f4f7fb] text-sm text-gray-900 rounded-full py-2.5 px-5 pr-10 focus:outline-none focus:ring-2 focus:ring-blue-100 placeholder-gray-400">
          <svg class="w-5 h-5 text-gray-500 absolute right-4 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>
      </div>

      <div class="flex items-center space-x-6">
        <button class="relative text-gray-700 hover:text-[#0b132b]">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
          <span class="absolute -top-1.5 -right-1.5 bg-[#326e51] text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center border border-white">3</span>
        </button>
        <button class="text-gray-700 hover:text-[#0b132b]">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
        </button>
        
        <!-- Profile Dropdown Container -->
        <div class="relative">
          <!-- Avatar Trigger -->
          <button (click)="toggleDropdown()" class="focus:outline-none flex items-center rounded-full ring-2 ring-transparent hover:ring-blue-100 transition-all">
            <img src="https://ui-avatars.com/api/?name=Jane+Doe&background=e2e8f0" alt="Profile" class="w-9 h-9 rounded-full border border-gray-200">
          </button>
          
          <!-- Dropdown Menu using modern @if control flow -->
          @if (isDropdownOpen()) {
            <div class="absolute right-0 mt-3 w-48 bg-white rounded-lg shadow-lg border border-gray-100 py-1 z-50">
              <div class="px-4 py-2 border-b border-gray-100 mb-1">
                <p class="text-sm font-semibold text-gray-900">Jane Doe</p>
                <p class="text-xs text-gray-500 truncate">jane.doe@example.com</p>
              </div>
              
              <button (click)="logout()" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 font-medium transition-colors flex items-center">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Log out
              </button>
            </div>
          }
        </div>

      </div>
    </header>
